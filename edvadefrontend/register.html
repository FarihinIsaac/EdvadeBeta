<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Edvade | Register</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">

    <div class="auth-card">
        <h2 class="auth-subtitle">Register</h2>

        <input class="auth-input" id="name" type="text" placeholder="Username" required />
        <input class="auth-input" id="mobile" type="text" placeholder="Mobile Number" required />
        <input class="auth-input" id="email" type="email" placeholder="Student e-mail address" required />
        <input class="auth-input" id="password" type="password" placeholder="Password" required />
        <input class="auth-input" id="password2" type="password" placeholder="Re-Type Password" required />

        <button class="auth-btn" type="button" onclick="registerStudent()">Register</button>

        <a class="auth-link" href="index.html">Back to Login</a>
    </div>

    <script src="js/auth.js"></script>
</body>
<canvas id="bgWorld"></canvas>
<script src="js/bgWorld.js"></script>
</html>
