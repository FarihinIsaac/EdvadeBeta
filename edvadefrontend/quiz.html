<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edvade | Quiz</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
<script src="js/loadHeader.js" defer></script>
  <script src="js/loadSidebar.js" defer></script>
  
  <main class="main">
    <div class="page centered">
      <div class="panel">
        <h2 id="modTitle" class="section-title">Quiz</h2>
        <div id="attemptsInfo" style="font-weight: bold; color: #c53030; margin-bottom: 16px; font-size: 14px;">Attempts Left: --</div>
        <div id="quizBox" class="posts"></div>

        <button id="submitBtn" onclick="submitQuiz()" class="btn-mini" style="margin-top:16px;">
          Submit Answers
        </button>

        <div id="result" style="margin-top:12px;font-weight:800;"></div>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    // ✅ protect: must be logged in + student
    requireAuth();
    if (localStorage.getItem("role") !== "student") {
      window.location.href = "index.html";
    }
  </script>

  <script src="js/levelup.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
