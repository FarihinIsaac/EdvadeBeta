<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Edvade | Settings</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <script src="js/loadHeader.js"></script>
  <div id="sidebarMount"></div>
  <script src="js/loadSidebar.js"></script>

  <main class="page">
    <div class="settings-wrap">
      <div class="card settings-card">
        <div class="row space settings-title">
          <h2 class="section-title m0">Settings</h2>
          <span class="pill" id="saveState">Saved</span>
        </div>

        <!-- Learning Preferences (Only for Students) -->
        <section class="panel" id="learningPreferencesPanel" style="display: none;">
          <div class="panel-head">
            <h3 class="m0">Learning Preferences</h3>
            <span class="chip">Learning Path</span>
          </div>
          <div class="grid-2">
            <div>
              <label class="lbl" for="difficultyPreference">Difficulty Level</label>
              <select id="difficultyPreference" class="input">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
            </div>
            <div>
              <label class="lbl" for="topicPreference">Preferred Topics</label>
              <input id="topicPreference" class="input" placeholder="e.g. Loops, OOP, Arrays" />
              <div class="muted small" style="margin-top: 6px;">Separate multiple topics with commas (e.g., Loops, OOP)</div>
            </div>
          </div>
        </section>

        <!-- Change Password -->
        <section class="panel">
          <div class="panel-head">
            <h3 class="m0">Change Password</h3>
            <span class="chip">Security</span>
          </div>

          <form id="pwForm" class="grid-2" autocomplete="on">
            <div>
              <label class="lbl" for="currentPw">Current password</label>
              <input id="currentPw" type="password" class="input" placeholder="••••••••" />
            </div>

            <div>
              <label class="lbl" for="newPw">New password</label>
              <input id="newPw" type="password" class="input" placeholder="At least 6 characters" />
            </div>

            <div>
              <label class="lbl" for="newPw2">Confirm new password</label>
              <input id="newPw2" type="password" class="input" placeholder="Repeat new password" />
            </div>

            <div class="pw-actions">
              <button class="btn" type="submit">Change Password</button>
              <div class="muted small" id="pwHint"></div>
            </div>
          </form>
        </section>

        <!-- Danger Zone -->
        <section class="panel danger">
          <div class="panel-head">
            <h3 class="m0">Danger Zone</h3>
            <span class="chip danger-chip">Irreversible</span>
          </div>
          <p class="muted small">Deleting your account permanently removes your data.</p>
          <button id="deleteAccount" class="btn danger-btn" type="button">Delete Account</button>
        </section>

        <div class="actions">
          <button id="resetSettings" class="btn ghost" type="button">Reset</button>
          <button id="saveSettings" class="btn" type="button">Save Settings</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/settings.js"></script>
</body>
<canvas id="bgWorld"></canvas>
<script src="js/bgWorld.js"></script>
</html>
