<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edvade | Learning Modules</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
<script src="js/loadHeader.js"></script>
<div id="sidebarMount"></div>
<script src="js/loadSidebar.js"></script>
  <div class="page centered">
      
      <!-- Header -->
      <div class="leaderboard-header">
        <div>
          <h1>Learning Modules</h1>
          <p>Complete modules to earn XP, unlock achievements, and level up! 📚</p>
        </div>
      </div>

      <!-- Modules List Panel -->
      <div class="panel" style="max-width: none;">
        <div class="panel-head">
          <h2>Learning Path</h2>
          <span class="chip">Modules</span>
        </div>
        <div id="moduleList" class="posts"></div>
      </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/levelup.js"></script>

  <script>
    // 🛡️ Auth + role protection
    requireAuth();
    if (localStorage.getItem("role") !== "student") {
      window.location.href = "index.html";
    }


    async function apiFetch(path) {
      const token = localStorage.getItem("token");
      const res = await fetch(API + path, {
        headers: {
          Authorization: `Bearer ${token}`,
          "Cache-Control": "no-cache",
          "Pragma": "no-cache"
        }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "Error");
      return data;
    }

    async function loadModules() {
      const container = document.getElementById("moduleList");

      try {
        const [modules, settings] = await Promise.all([
          apiFetch("/modules"),
          apiFetch("/settings").catch(() => ({}))
        ]);

        const selectedPreferredModuleId = String(settings.topicPreference || "");
        const modulePreferenceMap = Object.fromEntries(
          (settings.modulePreferences || []).map(pref => [
            String(pref.moduleId ?? pref.module_id),
            pref.difficultyPreference || pref.difficulty_preference || "beginner"
          ])
        );

        if (modules.length === 0) {
          container.innerHTML = `<div class="empty">No modules available yet.</div>`;
          return;
        }

        // Score modules based on topic matches and difficulty level
        const scoredModules = modules.map(m => {
          let score = 0;
          const reasons = [];

          // Topic match
          const hasTopicMatch = selectedPreferredModuleId && String(m.id) === selectedPreferredModuleId;
          if (hasTopicMatch) {
            score += 10;
            reasons.push("Topic Match");
          }

          // Determine active difficulty for this student based on available question difficulties in this module
          const avail = m.difficulties || ["beginner"];
          const preferredDifficulty = modulePreferenceMap[String(m.id)] || "beginner";
          let mDiff = preferredDifficulty;
          if (avail.length && !avail.includes(preferredDifficulty)) {
            mDiff = avail[0] || "beginner";
          }

          if (mDiff === preferredDifficulty) {
            score += 5;
            reasons.push(`${preferredDifficulty.charAt(0).toUpperCase() + preferredDifficulty.slice(1)} Level`);
          } else {
            reasons.push(`${mDiff.charAt(0).toUpperCase() + mDiff.slice(1)} Level`);
          }

          return { ...m, score, reasons, difficulty: mDiff };
        });

        // Sort: Unlocked first, then by score descending (recommended first), then by order
        scoredModules.sort((a, b) => {
          if (a.unlocked !== b.unlocked) {
            return b.unlocked ? 1 : -1;
          }
          if (b.score !== a.score) {
            return b.score - a.score;
          }
          return a.order_no - b.order_no;
        });

        container.innerHTML = scoredModules.map(m => {
          let diffIcon = "🟢";
          let diffColorBg = "rgba(34, 197, 94, 0.15)";
          let diffColorBorder = "rgba(34, 197, 94, 0.3)";
          let diffColorText = "#15803d";
          
          if (m.difficulty === "intermediate") {
            diffIcon = "🟡";
            diffColorBg = "rgba(234, 179, 8, 0.15)";
            diffColorBorder = "rgba(234, 179, 8, 0.3)";
            diffColorText = "#a16207";
          } else if (m.difficulty === "advanced") {
            diffIcon = "🔴";
            diffColorBg = "rgba(239, 68, 68, 0.15)";
            diffColorBorder = "rgba(239, 68, 68, 0.3)";
            diffColorText = "#b91c1c";
          }

          const diffBadge = `<span class="chip" style="background: ${diffColorBg}; border: 2px solid ${diffColorBorder}; color: ${diffColorText}; font-size: 11px; margin-left: 8px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px;">${diffIcon} ${m.difficulty.charAt(0).toUpperCase() + m.difficulty.slice(1)}</span>`;

          const recBadge = m.reasons.length > 0
            ? `<span class="chip" style="background: rgba(251, 191, 36, 0.15); border: 2px solid rgba(251, 191, 36, 0.3); color: #b45309; font-size: 11px; margin-left: 8px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px;">⭐ Recommended (${m.reasons.join(", ")})</span>`
            : "";

          const borderStyle = m.score > 0 ? `style="border-left: 6px solid #fbbf24;"` : "";

          return `
            <div class="post ${m.unlocked ? "" : "locked"}" ${borderStyle}>
              <div class="row space">
                <div>
                  <div class="post-title" style="display: flex; align-items: center; flex-wrap: wrap; gap: 4px;">
                    ${m.title}
                    ${diffBadge}
                    ${recBadge}
                  </div>
                  <div class="muted small">${m.description || ""}</div>
                  <div class="muted small">Unlock Points: ${m.unlock_points}</div>
                </div>

                ${
                  m.unlocked
                    ? `<button class="btn-mini" onclick="openModule(${m.id})">Start</button>`
                    : `<span class="quest-status locked">Locked 🔒</span>`
                }
              </div>
            </div>
          `;
        }).join("");

      } catch (err) {
        container.innerHTML = `<div class="empty">Error loading modules</div>`;
      }
    }

function openModule(id) {
  window.location.href = `learning.html?moduleId=${id}`;
}

    loadModules();
  </script>

</body>
<canvas id="bgWorld"></canvas>
<script src="js/bgWorld.js"></script>
</html>
