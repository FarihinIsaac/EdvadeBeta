<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edvade | Lecturer Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="lecturer-reports-page">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">Edvade (Lecturer)</div>
    <div class="top-actions">
      <button class="btn-ghost" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- App Layout -->
  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar-lecturer">
      <div class="sidebar-label">Home</div>
      <div class="sidebtn sidebtn-active" onclick="location.href='lecturer-dashboard.html'" title="Dashboard">🏠</div>
      <div class="sidebtn" onclick="location.href='lecturer-module.html'" title="Modules">📚</div>
      <div class="sidebtn" onclick="location.href='lecturer-quiz.html'" title="Quiz Bank">🧪</div>
      <div class="sidebtn" onclick="location.href='lecturer-reports.html'" title="Reports">📊</div>
      <div class="sidebtn" onclick="logout()" title="Logout">🚪</div>
    </div>

    <!-- Main Content -->
    <main class="main reports-main">
      <div class="reports-shell">
        <header class="reports-header">
          <div>
            <h1 class="reports-title">Dashboard</h1>
            <p class="reports-subtitle">Manage your modules, quizzes, and class announcements.</p>
          </div>
        </header>

        <!-- Quick Stats -->
        <section class="reports-kpi-grid" id="kpiGrid">
          <div class="reports-kpi-card">
            <div class="reports-kpi-icon">📚</div>
            <div class="reports-kpi-body">
              <div class="reports-kpi-label">Modules Created</div>
              <div class="reports-kpi-value" id="kpiModules">—</div>
            </div>
          </div>
          <div class="reports-kpi-card">
            <div class="reports-kpi-icon">🧪</div>
            <div class="reports-kpi-body">
              <div class="reports-kpi-label">Quizzes</div>
              <div class="reports-kpi-value" id="kpiQuizzes">—</div>
            </div>
          </div>
          <div class="reports-kpi-card">
            <div class="reports-kpi-icon">👥</div>
            <div class="reports-kpi-body">
              <div class="reports-kpi-label">Students Enrolled</div>
              <div class="reports-kpi-value" id="kpiStudents">—</div>
            </div>
          </div>
          <div class="reports-kpi-card">
            <div class="reports-kpi-icon">📢</div>
            <div class="reports-kpi-body">
              <div class="reports-kpi-label">Announcements</div>
              <div class="reports-kpi-value" id="kpiAnnouncements">—</div>
            </div>
          </div>
        </section>

        <div class="reports-layout">
          <!-- Main: announcements -->
          <section class="reports-panel">
            <div class="reports-panel-head">
              <h2>Send Announcement</h2>
              <span class="chip">To students</span>
            </div>

            <form id="announcementForm" class="form">
              <label class="label" for="announcementTitle">Title</label>
              <input id="announcementTitle" class="input" placeholder="Class update, deadline, or reminder" />
              <label class="label" for="announcementMessage">Message</label>
              <textarea id="announcementMessage" class="textarea" placeholder="Type the announcement for students here..."></textarea>
              <button type="submit" class="btn">Publish Announcement</button>
              <span id="announcementStatus" class="muted small"></span>
            </form>

            <div class="divider"></div>

            <div class="reports-panel-head" style="margin-top: 20px; margin-bottom: 16px;">
              <h2>Latest Announcement</h2>
            </div>
            <div id="currentAnnouncement" class="announcement-widget"></div>
          </section>

          <!-- Right: quick links -->
          <aside class="reports-aside">
            <div class="reports-panel">
              <div class="reports-panel-head">
                <h2>Quick Actions</h2>
                <span class="chip">Navigation</span>
              </div>

              <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn" onclick="location.href='lecturer-module.html'" style="width: 100%;">
                  📚 Manage Modules
                </button>
                <button class="btn" onclick="location.href='lecturer-quiz.html'" style="width: 100%;">
                  🧪 Manage Quizzes
                </button>
                <button class="btn" onclick="location.href='lecturer-reports.html'" style="width: 100%;">
                  📊 View Analytics
                </button>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/announcements.js"></script>
  <script>
    requireAuth();
    if (localStorage.getItem("role") !== "lecturer") window.location.href = "index.html";

    async function apiFetch(path, options = {}) {
      const token = localStorage.getItem("token");
      const res = await fetch(API + path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
          ...(options.headers || {})
        }
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || "Request failed");
      return data;
    }

    async function loadKPIs() {
      try {
        // Get modules
        const modules = await apiFetch("/lecturer/modules");
        
        // Count total questions across all modules
        let totalQuestions = 0;
        for (const mod of modules) {
          const questions = await apiFetch(`/lecturer/modules/${mod.id}/questions`);
          totalQuestions += questions.length;
        }

        // Update KPI cards
        document.getElementById("kpiModules").textContent = modules.length;
        document.getElementById("kpiQuizzes").textContent = totalQuestions;
        document.getElementById("kpiAnnouncements").textContent = "1";
        document.getElementById("kpiStudents").textContent = "—";
      } catch (e) {
        console.error("Error loading KPIs:", e);
        document.getElementById("kpiModules").textContent = "!";
      }
    }

    (async () => {
      if (localStorage.getItem("role") !== "lecturer") {
        window.location.href = "index.html";
      }
      
      // Load KPIs
      await loadKPIs();
      
      // Initialize announcement editor
      await initAnnouncementEditor(
        "announcementForm",
        "announcementTitle",
        "announcementMessage",
        "announcementStatus",
        "currentAnnouncement"
      );

      // Refresh button
      document.getElementById("refreshBtn")?.addEventListener("click", () => {
        loadKPIs();
      });
    })();
  </script>
</body>
</html>
