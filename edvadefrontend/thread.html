<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Edvade | Thread</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <script src="js/loadHeader.js"></script>
  <div id="sidebarMount"></div>
  <script src="js/loadSidebar.js"></script>

  <div class="page">
    <div id="threadBox"></div>

    <div class="card">
      <h3 class="m0">Reply</h3>
      <textarea id="replyBody" class="textarea" placeholder="Write your reply..."></textarea>
      <button class="btn" id="replyBtn" type="button">Send Reply</button>
      <div class="muted small" id="replyHint"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/levelup.js"></script>
  <script src="js/thread.js"></script>
</body>
</html>
